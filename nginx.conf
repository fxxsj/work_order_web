server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Fingerprinted build assets can be cached permanently. Missing assets must
    # return a real, non-cacheable 404 instead of the SPA entry page; otherwise
    # a rolling deployment can cache index.html under a future chunk URL.
    location /assets/ {
        try_files $uri @asset_not_found;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location @asset_not_found {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 404;
    }

    location = /env.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # API proxy (configure BACKEND_URL environment variable)
    location /api/ {
        proxy_pass $BACKEND_URL;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
