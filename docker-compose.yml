version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workorder_web
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ghcr.io/fxxsj/work_order_backend:latest
    container_name: workorder_backend
    env_file:
      - .env
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=postgres://${POSTGRES_USER:-workorder}:${POSTGRES_PASSWORD:-workorder}@db:5432/${POSTGRES_DB:-workorder}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workorder}
      POSTGRES_USER: ${POSTGRES_USER:-workorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workorder}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workorder}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
